# AI.ttorney Performance Testing Configuration

# JMeter Properties
jmeter.threads.sampler.timeout=120000
jmeter.threads.rampup.rampup=10
jmeter.threads.initialdelay=0

# HTTP Request Settings
httpclient.timeout=120000
httpclient.socket.timeout=60000
httpclient.connection.timeout=30000
httpclient.max_retries=3

# Results and Reporting
jmeter.save.saveservice.output_format=xml
jmeter.save.saveservice.data_type=true
jmeter.save.saveservice.label=true
jmeter.save.saveservice.response_code=true
jmeter.save.saveservice.response_data=true
jmeter.save.saveservice.response_message=true
jmeter.save.saveservice.successful=true
jmeter.save.saveservice.thread_name=true
jmeter.save.saveservice.time=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.timestamp=true
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.url=true
jmeter.save.saveservice.connect_time=true

# SSL/TLS Settings
https.use.cached.ssl.context=true
https.default.protocol=TLS
https.socket.protocols=TLSv1.2,TLSv1.3

# Logging
log_level.jmeter=INFO
log_level.jmeter.engine=WARN
log_level.jmeter.util=WARN

# Memory Settings (adjust based on your system)
heap=2048m
newsize=512m
maxheap=2048m

# Performance Settings
jmeterengine.remote.system.exit=false
jmeterengine.stopfail.system.exit=false

# CSV Dataset Configuration
csvdataset.file.encoding=UTF-8
csvdataset.delimiter=,

# JSON Extractor Settings
json.extractor.cache.size=100

# Response Assertion Settings
assertion.default_failure_message=Request failed

# Thread Group Settings
threadgroup.delay=100
threadgroup.duration=0
threadgroup.scheduler=false

# Results File Configuration
jmeter.save.saveservice.print_field_names=true
jmeter.save.saveservice.autoflush=true

# Summary Report Settings
summariser.name=Summary Report
summariser.interval=30
summariser.out=true

# Graphite Backend (optional)
# backend.graphite.send_interval=5
# backend.graphite.host=localhost
# backend.graphite.port=2003

# Custom User-Agent
jmeter.useragent=AI.ttorney-Performance-Test/1.0
