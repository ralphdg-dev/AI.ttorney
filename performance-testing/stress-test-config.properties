# AI.ttorney Stress Testing Configuration
# Updated for production stress testing

# Server Configuration
BASE_URL=https://aittorney-production.up.railway.app
PROTOCOL=https
PORT=443

# Stress Test Scenarios
# Light Load: Basic functionality
LIGHT_USERS=10
LIGHT_RAMP_TIME=30
LIGHT_DURATION=300
LIGHT_LOOPS=50

# Medium Load: Normal traffic
MEDIUM_USERS=50
MEDIUM_RAMP_TIME=60
MEDIUM_DURATION=600
MEDIUM_LOOPS=100

# Heavy Load: Peak traffic
HEAVY_USERS=100
HEAVY_RAMP_TIME=120
HEAVY_DURATION=900
HEAVY_LOOPS=200

# Stress Test: Maximum capacity
STRESS_USERS=200
STRESS_RAMP_TIME=180
STRESS_DURATION=1200
STRESS_LOOPS=500

# Soak Test: Sustained load
SOAK_USERS=75
SOAK_RAMP_TIME=300
SOAK_DURATION=3600
SOAK_LOOPS=1000

# Timeout Settings (milliseconds)
CONNECT_TIMEOUT=10000
RESPONSE_TIMEOUT=30000

# Thread Group Settings
THREAD_DELAY=100
SAME_USER_NEXT_ITERATION=true
ON_SAMPLE_ERROR=continue

# Response Assertions
EXPECTED_RESPONSE_CODE=200
MAX_RESPONSE_TIME=5000
MAX_ERROR_RATE=5.0

# Data Settings
THINK_TIME=1000
RANDOM_DELAY_MIN=500
RANDOM_DELAY_MAX=2000

# Monitoring
ENABLE_MONITORING=true
COLLECT_RESPONSE_TIMES=true
COLLECT_ERROR_RATE=true
COLLECT_THROUGHPUT=true

# Results
RESULTS_FORMAT=csv
GENERATE_HTML_REPORT=true
SAVE_RESPONSE_DATA=false

# Advanced Settings
ENABLE_COOKIES=true
FOLLOW_REDIRECTS=true
USE_KEEPALIVE=true
CONCURRENT_POOL=10
CONNECTIONS_PER_HOST=10
